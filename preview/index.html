<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معاينة تصميم الدعوة</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="معاينة تصميم دعوة زفاف شادي و زينة">
<meta property="og:description" content="شو رأيك؟ أي تصميم أحلى، الأول أو الثاني؟">
<meta property="og:image" content="https://shadyzeina.com/assets/og.png">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@700&display=swap">
<style>
  :root{color-scheme:light;--bg:#F4ECDF;--card:#FCF8F1;--ink:#33291F;--ink-2:#6B5B49;--ink-3:#8C7A63;--line:rgba(156,122,60,.34);
    --foil:linear-gradient(118deg,#6E5020 0%,#A8823F 26%,#E6CA86 44%,#A8823F 60%,#6E5020 82%,#7E5E24 100%);}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:url(../assets/damask-a.svg) 0 0/250px 290px,var(--bg);color:var(--ink);
    font-family:Tajawal,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
  main{width:min(460px,100%);text-align:center;}
  h1{margin:0;font-family:"Noto Nastaliq Urdu",serif;font-size:2.3rem;line-height:2.1;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{margin:0 0 26px;color:var(--ink-2);font-size:1rem;line-height:1.8;}
  a.opt{display:flex;align-items:center;gap:16px;text-align:right;text-decoration:none;color:inherit;margin-bottom:14px;padding:18px 20px;border-radius:14px;
    background:var(--card);border:1.5px solid transparent;
    background:linear-gradient(var(--card),var(--card)) padding-box,var(--foil) border-box;box-shadow:0 12px 28px -14px rgba(70,48,18,.35);}
  a.opt b{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--foil);color:#FFF9EC;font-size:1.2rem;}
  a.opt span{display:flex;flex-direction:column;gap:2px;}
  a.opt strong{font-family:Amiri,serif;font-size:1.3rem;}
  a.opt small{color:var(--ink-3);font-size:.9rem;line-height:1.5;}
  .note{margin-top:18px;color:var(--ink-3);font-size:.85rem;}
</style>
</head>
<body>
<main>
  <h1>شَادي و زَينَة</h1>
  <p class="sub">عم نختار تصميم دعوة العرس<br>افتح التصميمين وقلّنا أيهم أحلى 🤍</p>
  <a class="opt" href="1/"><b>1</b><span><strong>التصميم الأول</strong><small>أول صفحة فيها اسم العريس والعروس، وبعدها نص الدعوة</small></span></a>
  <a class="opt" href="2/"><b>2</b><span><strong>التصميم الثاني</strong><small>الحرفين الأولين من الاسمين بإطار مزخرف فوق نص الدعوة</small></span></a>
  <p class="note">اكبس على الختم لفتح المغلف · هاي نسخة للمعاينة فقط</p>
</main>
</body>
</html>
